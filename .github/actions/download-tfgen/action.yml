name: Download the tfgen binary
description: Downloads the tfgen binary to `bin/`.

runs:
    using: "composite"
    steps:
        - name: Download pulumi-tfgen-outscale
          uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
          with:
              name: pulumi-tfgen-outscale
              path: ${{ github.workspace }}/bin

        - name: Ensure pulumi-tfgen-outscale is executable
          shell: bash
          run: |
              find ${{ github.workspace }} -name "pulumi-*-outscale" -print -exec chmod +x {} \;
